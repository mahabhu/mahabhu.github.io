<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact &mdash; Mashroor Hasan Bhuiyan</title>
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/css/site.css">
    <style>
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            max-width: 720px;
            margin: 0 auto;
        }

        .contact-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: var(--surface);
            border-radius: var(--radius);
            color: var(--ink-strong);
            text-decoration: none;
            font-size: 1.05em;
            box-shadow: var(--shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .contact-link:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .contact-link i {
            font-size: 1.4em;
            width: 28px;
            text-align: center;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button onclick="window.location.href='index.html'" aria-label="Home"><i class="fas fa-home"></i></button>
        <button onclick="window.location.href='career.html'" aria-label="Career"><i class="fas fa-graduation-cap"></i></button>
        <button onclick="window.location.href='skills.html'" aria-label="Skills"><i class="fas fa-th-large"></i></button>
        <button onclick="window.location.href='resume.html'" aria-label="Resume"><i class="fas fa-file-alt"></i></button>
        <button onclick="window.location.href='contact.html'" aria-current="page" aria-label="Contact"><i class="fas fa-paperclip"></i></button>
    </div>

    <main>
        <header>
            <h1 class="header-title">Mashroor Hasan Bhuiyan</h1>
        </header>

        <section>
            <h2 class="section-title">Connect with Me</h2>
            <div class="contact-grid">
                <a href="https://www.facebook.com/mashroor.hasan.bhuiyan/" class="contact-link" target="_blank" rel="noopener"><i class="fab fa-facebook"></i><span>Facebook</span></a>
                <a href="https://x.com/MashroorHasan" class="contact-link" target="_blank" rel="noopener"><i class="fab fa-twitter"></i><span>Twitter</span></a>
                <a href="https://github.com/mahabhu" class="contact-link" target="_blank" rel="noopener"><i class="fab fa-github"></i><span>GitHub</span></a>
                <a href="https://www.linkedin.com/in/mashroor-hasan-bhuiyan-7a4199213/" class="contact-link" target="_blank" rel="noopener"><i class="fab fa-linkedin"></i><span>LinkedIn</span></a>
                <a href="mailto:MashroorHasan.Bhuiyan@utdallas.edu" class="contact-link"><i class="fas fa-envelope"></i><span>Email</span></a>
            </div>
        </section>

        <footer>
            <p>&copy; 2025 Mashroor Hasan Bhuiyan. All Rights Reserved.</p>
        </footer>
    </main>

</body>
</html>
