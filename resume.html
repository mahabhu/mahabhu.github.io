<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume &mdash; Mashroor Hasan Bhuiyan</title>
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/css/site.css">
    <style>
        .resume-cta {
            text-align: center;
        }

        .resume-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 48px 32px;
            max-width: 520px;
            margin: 0 auto;
        }

        .resume-card p {
            margin: 0 0 24px;
            color: var(--ink);
            line-height: 1.6;
        }

        .resume-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 32px;
            background: var(--accent);
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.05em;
            font-weight: 600;
            transition: background-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
        }

        .resume-btn:hover {
            background: var(--accent-soft);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .resume-btn i {
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button onclick="window.location.href='index.html'" aria-label="Home"><i class="fas fa-home"></i></button>
        <button onclick="window.location.href='career.html'" aria-label="Career"><i class="fas fa-graduation-cap"></i></button>
        <button onclick="window.location.href='skills.html'" aria-label="Skills"><i class="fas fa-th-large"></i></button>
        <button onclick="window.location.href='resume.html'" aria-current="page" aria-label="Resume"><i class="fas fa-file-alt"></i></button>
        <button onclick="window.location.href='contact.html'" aria-label="Contact"><i class="fas fa-paperclip"></i></button>
    </div>

    <main>
        <header>
            <h1 class="header-title">Mashroor Hasan Bhuiyan</h1>
        </header>

        <section class="resume-cta">
            <h2 class="section-title">Resume</h2>
            <div class="resume-card">
                <p>The full resume is hosted externally and opens in a new tab.</p>
                <a href="https://tinyurl.com/mashroorhasanbhuiyanresume" target="_blank" rel="noopener" class="resume-btn">
                    <i class="fas fa-file-alt"></i>
                    <span>View Resume</span>
                </a>
            </div>
        </section>

        <footer>
            <p>&copy; 2025 Mashroor Hasan Bhuiyan. All Rights Reserved.</p>
        </footer>
    </main>

</body>
</html>
