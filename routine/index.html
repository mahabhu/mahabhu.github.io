<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Daily Routine Pie</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
      color: #fff;
      font-family: "Ubuntu Mono", monospace;
      position: relative;
    }
    text {
      fill: white;
      font-size: 11px;
      pointer-events: none;
      font-family: "Ubuntu Mono", monospace;
    }
    .hour-marker {
      stroke: #666;
      stroke-width: 1;
    }
    #copyBtn {
      position: fixed;
      bottom: 16px;
      right: 16px;
      padding: 10px 14px;
      background: #1e1e1e;
      color: #e6e6e6;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }
    #toggleBtn {
      position: fixed;
      bottom: 60px;
      right: 16px;
      padding: 10px 14px;
      background: #2e2e2e;
      color: #e6e6e6;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      min-width: 120px;
    }
    #copyBtn:hover, #toggleBtn:hover {
      background: #3a3a3a;
    }
    #copyBtn:active, #toggleBtn:active {
      background: #4a4a4a;
    }
    #copyFeedback {
      position: fixed;
      bottom: 16px;
      right: 120px;
      color: #4CAF50;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #modeIndicator {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      background: #1e1e1e;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .mode-ideal { border-color: #4CAF50; color: #4CAF50; }
    .mode-real { border-color: #2196F3; color: #2196F3; }
  </style>
</head>
<body>
  <div id="modeIndicator" class="mode-ideal">Ideal Routine</div>
  <button id="toggleBtn">Show Real</button>
  <button id="copyBtn">Copy</button>
  <div id="copyFeedback">Copied!</div>
  <svg width="800" height="800"></svg>

<script>
  // State variables
  let currentMode = 'ideal'; // 'ideal' or 'real'
  let currentData = null;
  
  // DOM elements
  const copyBtn = document.getElementById("copyBtn");
  const copyFeedback = document.getElementById("copyFeedback");
  const toggleBtn = document.getElementById("toggleBtn");
  const modeIndicator = document.getElementById("modeIndicator");
  
  // Get today's date in yymmdd format
  function getTodayDate() {
    const now = new Date();
    const year = now.getFullYear().toString().slice(-2);
    const month = (now.getMonth() + 1).toString().padStart(2, '0');
    const day = now.getDate().toString().padStart(2, '0');
    return `${year}${month}${day}`;
  }
  
  // Get ideal file name (based on day of week)
  function getIdealFileName() {
    const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
    const today = new Date().getDay(); // 0 = Sunday, 1 = Monday, etc.
    return `week/${days[today]}.json`;
  }
  
  // Get real file name (based on today's date)
  function getRealFileName() {
    return `real/${getTodayDate()}.json`;
  }
  
  // Get file name based on current mode
  function getFileName() {
    return currentMode === 'ideal' ? getIdealFileName() : getRealFileName();
  }
  
  // Copy function (unchanged)
  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        showFeedback();
        return;
      }
    } catch (err) {
      console.log('Modern clipboard API failed, trying fallback');
    }

    try {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-999999px";
      textarea.style.top = "-999999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      
      const success = document.execCommand("copy");
      document.body.removeChild(textarea);
      
      if (success) {
        showFeedback();
      } else {
        console.error('Fallback copy failed');
      }
    } catch (err) {
      console.error('Both copy methods failed:', err);
    }
  }
  
  function showFeedback() {
    copyFeedback.style.opacity = 1;
    setTimeout(() => {
      copyFeedback.style.opacity = 0;
    }, 2000);
  }
  
  // Helper functions
  function toMinutes(t) {
    return parseInt(t.slice(0,2)) * 60 + parseInt(t.slice(2));
  }
  
  function duration(range) {
    const [start, end] = range.split("-");
    let s = toMinutes(start);
    let e = toMinutes(end);
    if (e <= s) e += 24 * 60;
    return (e - s) / 60;
  }
  
  function convert(obj) {
    return Object.entries(obj).map(([name, value]) => {
      return typeof value === "string" 
        ? { name, value: duration(value) }
        : { name, children: convert(value) };
    });
  }
  
  // Find start time
  function findStartTime(obj) {
    const firstKey = Object.keys(obj)[0];
    const firstValue = obj[firstKey];
    
    if (typeof firstValue === "string") {
      const startHour = parseInt(firstValue.split("-")[0].slice(0,2));
      const startMinute = parseInt(firstValue.split("-")[0].slice(2));
      return startHour + startMinute/60;
    }
    return findStartTime(firstValue);
  }
  
  // Update UI based on mode
  function updateModeUI() {
    const modeText = currentMode === 'ideal' ? 'Ideal Routine' : 'Real Routine';
    const buttonText = currentMode === 'ideal' ? 'Show Real' : 'Show Ideal';
    const modeClass = currentMode === 'ideal' ? 'mode-ideal' : 'mode-real';
    
    modeIndicator.textContent = modeText;
    modeIndicator.className = modeClass;
    toggleBtn.textContent = buttonText;
  }
  
  // Toggle between ideal and real modes
  function toggleMode() {
    currentMode = currentMode === 'ideal' ? 'real' : 'ideal';
    updateModeUI();
    loadAndDrawData();
  }
  
  // Load data and create chart
  async function loadAndDrawData() {
    const fileName = getFileName();
    
    try {
      const response = await fetch(fileName);
      if (!response.ok) {
        throw new Error(`File not found: ${fileName}`);
      }
      const fileData = await response.json();
      currentData = fileData;
      
      // Clear existing chart
      d3.select("svg").selectAll("*").remove();
      
      // Create new chart
      createChart(fileData);
    } catch (error) {
      console.log(`Error loading ${fileName}:`, error.message);
      
      // Fallback: Use embedded data if available, or show error
      const fallbackData = {
        "self time": "2300-2100",
        "cooking": "2100-2300"
      };
      
      // Clear existing chart
      d3.select("svg").selectAll("*").remove();
      
      // Show error message on chart
      const svg = d3.select("svg")
        .attr("viewBox", [0, 0, 800, 800])
        .append("g")
        .attr("transform", "translate(400,400)");
      
      svg.append("text")
        .attr("text-anchor", "middle")
        .attr("dy", "0.35em")
        .attr("fill", "#ff5555")
        .text(`File not found: ${fileName}`);
      
      svg.append("text")
        .attr("text-anchor", "middle")
        .attr("dy", "1.5em")
        .attr("fill", "#aaa")
        .text("Using fallback data");
      
      // Create chart with fallback data
      createChart(fallbackData);
    }
  }
  
  // Create the chart visualization
  function createChart(rawData) {
    const width = 800;
    const radius = width / 2;
    
    // Clear and set up SVG
    const svg = d3.select("svg")
      .attr("viewBox", [0, 0, width, width])
      .append("g")
      .attr("transform", `translate(${radius},${radius})`);
    
    // Convert data for d3
    const data = {
      name: "Day",
      children: convert(rawData)
    };
    
    const partition = d3.partition().size([2 * Math.PI, radius]);
    const root = d3.hierarchy(data).sum(d => d.value || 0.0001);
    partition(root);
    
    // Calculate start time from data
    const startHour = findStartTime(rawData) % 24;
    const offset = (startHour / 24) * 2 * Math.PI;
    
    const arc = d3.arc()
      .startAngle(d => d.x0 + offset)
      .endAngle(d => d.x1 + offset)
      .innerRadius(d => d.y0)
      .outerRadius(d => d.y1);
    
    // Draw arcs
    svg.selectAll("path")
      .data(root.descendants())
      .join("path")
      .attr("d", arc)
      .attr("fill", d => d3.interpolateRainbow(d.x0 / (2 * Math.PI)))
      .attr("stroke", "#111");
    
    // Labels
    svg.selectAll("text")
      .data(root.descendants().filter(d => d.depth))
      .join("text")
      .attr("transform", d => {
        let angle = ((d.x0 + d.x1) / 2 + offset) * 180 / Math.PI;
        const r = (d.y0 + d.y1) / 2;
        while(angle>=360) angle-=360.0;
        while(angle<0) angle+=360.0;
        return `rotate(${angle - 90}) translate(${r},0) rotate(${(angle>=0 && angle < 180) ? 0 : 180})`;
      })
      .attr("dx", "-20")
      .attr("dy", ".35em")
      .text(d => d.data.name);
    
    // Hour markers
    const markerInner = 400 * 0.8;
    const markerOuter = 400 * 0.9;
    
    for (let i = 0; i < 24; i++) {
      const angle = (i / 24) * 2 * Math.PI;
      const x1 = Math.cos(angle) * markerInner;
      const y1 = Math.sin(angle) * markerInner;
      const x2 = Math.cos(angle) * markerOuter;
      const y2 = Math.sin(angle) * markerOuter;
      
      svg.append("line")
        .attr("x1", x1)
        .attr("y1", y1)
        .attr("x2", x2)
        .attr("y2", y2)
        .attr("class", "hour-marker");
      
      // Add hour labels
      const labelAngle = ((i-6) / 24) * 2 * Math.PI;
      const labelRadius = 400 * 0.95;
      const x = Math.cos(labelAngle) * labelRadius;
      const y = Math.sin(labelAngle) * labelRadius;
      
      svg.append("text")
        .attr("x", x)
        .attr("y", y)
        .attr("text-anchor", "middle")
        .attr("dy", "0.35em")
        .text(i === 0 ? "12 AM" : i === 12 ? "12 PM" : i % 12)
        .attr("font-size", "10px")
        .attr("fill", "#aaa");
    }
    
    // Current time arrow
    const now = new Date();
    const minutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    const angle = (minutes / (24 * 60) + 0.75) * 2 * Math.PI;
    
    const arrowOuter = radius + 25;
    const arrowInner = radius - 50;
    
    svg.append("line")
      .attr("x1", Math.cos(angle) * arrowOuter)
      .attr("y1", Math.sin(angle) * arrowOuter)
      .attr("x2", Math.cos(angle) * arrowInner)
      .attr("y2", Math.sin(angle) * arrowInner)
      .attr("stroke", "white")
      .attr("stroke-width", 2);
    
    svg.append("circle")
      .attr("cx", Math.cos(angle) * arrowInner)
      .attr("cy", Math.sin(angle) * arrowInner)
      .attr("r", 3)
      .attr("fill", "white");
    
    // Add current day display
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const today = days[new Date().getDay()];
    
    svg.append("text")
      .attr("x", -radius + 30)
      .attr("y", -radius + 30)
      .attr("text-anchor", "start")
      .attr("font-size", "32px")
      .attr("font-weight", "bold")
      .attr("fill", "#fff")
      .text(`${today}`);
  }
  
  // Event listeners
  copyBtn.addEventListener("click", () => {
    const textToCopy = JSON.stringify(currentData, null, 2);
    copyText(textToCopy);
  });
  
  toggleBtn.addEventListener("click", toggleMode);
  
  // Initialize
  updateModeUI();
  loadAndDrawData();
</script>
</body>
</html>
