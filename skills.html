<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills &mdash; Mashroor Hasan Bhuiyan</title>
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/css/site.css">
    <style>
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
        }

        .skill-card {
            background-color: var(--surface);
            border-radius: 14px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 28px 16px;
            min-height: 180px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .skill-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .skill-card img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 16px;
        }

        .skill-name {
            font-weight: 600;
            color: var(--ink-strong);
            font-size: 0.95em;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button onclick="window.location.href='index.html'" aria-label="Home"><i class="fas fa-home"></i></button>
        <button onclick="window.location.href='career.html'" aria-label="Career"><i class="fas fa-graduation-cap"></i></button>
        <button onclick="window.location.href='skills.html'" aria-current="page" aria-label="Skills"><i class="fas fa-th-large"></i></button>
        <button onclick="window.location.href='resume.html'" aria-label="Resume"><i class="fas fa-file-alt"></i></button>
        <button onclick="window.location.href='contact.html'" aria-label="Contact"><i class="fas fa-paperclip"></i></button>
    </div>

    <main>
        <header>
            <h1 class="header-title">Mashroor Hasan Bhuiyan</h1>
        </header>

        <section>
            <h2 class="section-title">Skills</h2>
            <div class="skills-container">
                <div class="skill-card">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/1/18/ISO_C%2B%2B_Logo.svg" alt="C++">
                    <div class="skill-name">C++</div>
                </div>
                <div class="skill-card">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c3/Python-logo-notext.svg" alt="Python">
                    <div class="skill-name">Python</div>
                </div>
                <div class="skill-card">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Svelte_Logo.svg" alt="Svelte">
                    <div class="skill-name">Svelte</div>
                </div>
                <div class="skill-card">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/9/92/LaTeX_logo.svg" alt="LaTeX">
                    <div class="skill-name">LaTeX</div>
                </div>
                <div class="skill-card">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Node.js_logo.svg" alt="Node.js">
                    <div class="skill-name">Node.js</div>
                </div>
                <div class="skill-card">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/2/29/Postgresql_elephant.svg" alt="PostgreSQL">
                    <div class="skill-name">PostgreSQL</div>
                </div>
                <div class="skill-card">
                    <img src="https://upload.wikimedia.org/wikipedia/en/3/30/Java_programming_language_logo.svg" alt="Java">
                    <div class="skill-name">Java</div>
                </div>
                <div class="skill-card">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Docker_%28container_engine%29_logo.svg" alt="Docker">
                    <div class="skill-name">Docker</div>
                </div>
                <div class="skill-card">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e9/Opengl-logo.svg" alt="OpenGL">
                    <div class="skill-name">OpenGL</div>
                </div>
            </div>
        </section>

        <footer>
            <p>&copy; 2025 Mashroor Hasan Bhuiyan. All Rights Reserved.</p>
        </footer>
    </main>

</body>
</html>
