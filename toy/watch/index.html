<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stopwatch</title>

  <!-- Ubuntu Mono (VSCode-like) -->
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0f0f0f;
      color: #e6e6e6;
      font-family: 'Ubuntu Mono', 'JetBrains Mono', monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #time {
      font-size: 3rem;
      letter-spacing: 0.15em;
      user-select: none;
      cursor: pointer;
    }

    #controls {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
    }

    button {
      padding: 10px 14px;
      background: #1e1e1e;
      color: #e6e6e6;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }

    button:hover {
      background: #2a2a2a;
    }

    button:active {
      background: #3a3a3a;
    }
  </style>
</head>
<body>

  <div id="time" title="click or press space to start/stop">00:00:00</div>
  <div id="controls">
    <button id="toggleBtn">Start</button>
    <button id="resetBtn">Reset</button>
  </div>

  <script>
  const timeEl = document.getElementById("time");
  const toggleBtn = document.getElementById("toggleBtn");
  const resetBtn = document.getElementById("resetBtn");

  let running = false;
  let startedAt = 0;   // timestamp when the current run began
  let elapsed = 0;     // ms accumulated from previous runs
  let timer = null;

  function pad(n) {
    return n.toString().padStart(2, "0");
  }

  function render() {
    const total = elapsed + (running ? Date.now() - startedAt : 0);
    const s = Math.floor(total / 1000);
    const hh = Math.floor(s / 3600);
    const mm = Math.floor((s % 3600) / 60);
    const ss = s % 60;
    timeEl.textContent = `${pad(hh)}:${pad(mm)}:${pad(ss)}`;
  }

  function start() {
    if (running) return;
    running = true;
    startedAt = Date.now();
    timer = setInterval(render, 200);
    toggleBtn.textContent = "Stop";
  }

  function stop() {
    if (!running) return;
    running = false;
    elapsed += Date.now() - startedAt;
    clearInterval(timer);
    timer = null;
    render();
    toggleBtn.textContent = "Start";
  }

  function toggle() {
    running ? stop() : start();
  }

  function reset() {
    stop();
    elapsed = 0;
    render();
  }

  toggleBtn.addEventListener("click", toggle);
  resetBtn.addEventListener("click", reset);
  timeEl.addEventListener("click", toggle);

  document.addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    else if (e.key === "r" || e.key === "R") reset();
  });

  render();
</script>

</body>
</html>
